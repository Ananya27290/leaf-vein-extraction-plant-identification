<!DOCTYPE html>
<html>

<head>

    <title>Prediction Result</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial, sans-serif;
            background:#f4f7f6;
        }

        .container{
            width:90%;
            margin:auto;
            padding:20px;
        }

        .header{
            background:#2e7d32;
            color:white;
            text-align:center;
            padding:20px;
            border-radius:10px;
        }

        .card{
            background:white;
            padding:20px;
            margin-top:20px;
            border-radius:10px;
            box-shadow:0px 0px 10px rgba(0,0,0,0.1);
        }

        .result{
            text-align:center;
        }

        .plant-name{
            color:#2e7d32;
            font-size:32px;
            font-weight:bold;
        }

        .confidence{
            font-size:22px;
            margin-top:10px;
        }

        .progress{
            width:80%;
            margin:auto;
            background:#ddd;
            border-radius:20px;
            overflow:hidden;
            margin-top:15px;
        }

        .progress-bar{
            background:#4caf50;
            color:white;
            padding:10px;
            text-align:center;
            font-weight:bold;
        }

        .images{
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:20px;
        }

        .image-box{
            text-align:center;
        }

        .image-box img{
            width:100%;
            border-radius:10px;
            border:2px solid #ddd;
        }

        h2{
            color:#2e7d32;
        }

        .back-btn{
            text-align:center;
            margin-top:30px;
        }

        .back-btn a{
            text-decoration:none;
            background:#2e7d32;
            color:white;
            padding:12px 25px;
            border-radius:5px;
        }

        .back-btn a:hover{
            background:#1b5e20;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>Leaf Vein Detection & Plant Identification</h1>

    </div>

    <div class="card result">

        <h2>Prediction Result</h2>

        <div class="plant-name">

            {{ plant_name }}

        </div>

        <div class="confidence">

            Confidence : {{ confidence }} %

        </div>

        <div class="progress">

            <div class="progress-bar"
                 style="width:{{ confidence }}%;">

                {{ confidence }} %

            </div>

        </div>

    </div>
    <div class="card">

        <h2>Uploaded Leaf Image</h2>

        <center>
            <img src="/{{ uploaded_image }}"
                width="400"
                style="border-radius:10px;">
        </center>

    </div>

    <div class="card">

        <h2>Image Processing Pipeline</h2>

        <div class="images">

            <div class="image-box">

                <h3>Grayscale</h3>

                <img src="/static/outputs/grayscale.jpg">

            </div>

            <div class="image-box">

                <h3>CLAHE</h3>

                <img src="/static/outputs/clahe.jpg">

            </div>

            <div class="image-box">

                <h3>Top Hat</h3>

                <img src="/static/outputs/tophat.jpg">

            </div>

            <div class="image-box">

                <h3>Threshold</h3>

                <img src="/static/outputs/threshold.jpg">

            </div>

            <div class="image-box">

                <h3>Opening</h3>

                <img src="/static/outputs/opening.jpg">

            </div>

            <div class="image-box">

                <h3>Final Vein Extraction</h3>

                <img src="/static/outputs/final_vein.jpg">

            </div>

        </div>

    </div>

    <div class="back-btn">

        <a href="/">Upload Another Leaf</a>

    </div>

</div>

</body>

</html>
